{% macro history_list(history, page, oob=false) -%}
<div id="history-list" {% if oob %}hx-swap-oob="true" {% endif %}class="flex-1 overflow-y-auto p-4 space-y-4 bg-brand-panel">
  {% if not history %}
  <p class="text-brand-muted font-bold font-mono text-sm uppercase text-center mt-10">No history yet</p>
  {% else %}
  {% for item in history %}
  <div
    hx-get="/ui/history/{{ item.number }}"
    {% if page == "app" %}hx-target="#results-area"{% else %}hx-swap="none"{% endif %}
    class="bg-brand-bg brutal-border p-4 cursor-pointer hover:-translate-y-1 transition-transform brutal-shadow-hover"
  >
    <p class="text-xs font-black font-mono text-brand-muted uppercase mb-2">Q{{ item.number }}</p>
    <p class="text-sm font-bold text-brand-text line-clamp-2">"{{ item.result.transcript }}"</p>
  </div>
  {% endfor %}
  {% endif %}
</div>
{% endmacro %}
