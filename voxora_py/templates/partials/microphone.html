<section class="my-12 flex flex-col items-center justify-center relative w-full">
  <div class="flex flex-col items-center gap-8 relative z-10 w-full max-w-md mx-auto">
    <button
      id="mic-idle"
      class="group relative flex flex-col items-center justify-center gap-4 transition-transform hover:-translate-y-1 active:translate-y-2 w-full bg-brand-panel brutal-border brutal-shadow p-8 cursor-pointer"
    >
      <div class="w-20 h-20 bg-brand-primary brutal-border flex items-center justify-center group-hover:bg-brand-primary-hover transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
        </svg>
      </div>
      <span class="font-black text-2xl uppercase tracking-widest text-brand-text">
        Tap to Speak
      </span>
    </button>

    <div
      id="mic-recording"
      hidden
      class="group relative flex flex-col items-center justify-center gap-4 w-full bg-red-100 brutal-border brutal-shadow p-8 cursor-pointer overflow-hidden"
    >
      <div class="absolute top-2 right-2 flex gap-2">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 brutal-border"></span>
        </span>
      </div>

      <canvas
        id="mic-canvas"
        width="200"
        height="80"
        class="w-full max-w-[200px] h-20"
      ></canvas>

      <span class="font-black text-2xl uppercase tracking-widest text-red-600 mt-2">
        Stop Recording
      </span>
    </div>

    <div id="mic-processing" hidden class="flex flex-col items-center justify-center gap-4 w-full bg-blue-100 brutal-border brutal-shadow p-8">
      <div class="w-20 h-20 bg-blue-500 brutal-border flex items-center justify-center animate-spin">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </div>
      <span class="font-black text-2xl uppercase tracking-widest text-blue-700">
        Processing...
      </span>
    </div>

    <div class="bg-brand-panel brutal-border p-4 w-full text-center">
      <p class="text-sm font-bold font-mono text-brand-text uppercase tracking-wider">
        Speak in English or Hindi. Max 30s.
      </p>
    </div>
  </div>
</section>
